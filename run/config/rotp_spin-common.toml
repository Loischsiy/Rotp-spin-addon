
[spin_energy]
	#Spin energy restored per tick (20 ticks = 1 second).
	#Range: 0.0 ~ 1000.0
	regenPerTick = 0.25
	#Maximum Spin energy a player can hold.
	#Range: 1.0 ~ 10000.0
	max = 100.0

[steel_ball]
	#A spinning ball starts returning to the thrower after this many ticks of flight (or earlier, on hit).
	#Range: 1 ~ 1200
	returnAfterTicks = 20
	#Spin energy consumed by a throw with Spin. Without enough energy the ball is thrown plainly: no return, lower damage.
	#Range: 0.0 ~ 10000.0
	spinCost = 20.0
	#Launch velocity of a ball thrown without Spin.
	#Range: 0.1 ~ 10.0
	plainVelocity = 1.0
	#How strongly a returning ball is pulled towards the thrower each tick.
	#Range: 0.01 ~ 2.0
	returnAcceleration = 0.15
	#Throw inaccuracy (vanilla arrow semantics).
	#Range: 0.0 ~ 10.0
	inaccuracy = 0.5
	#Chance (0..1) for the ball to become damaged when it hits a block. A damaged ball is imperfect and weaker.
	#Range: 0.0 ~ 1.0
	damagedChanceOnBlockHit = 0.05
	#Base damage of a spinning ball (multiplied by its velocity, like an arrow).
	#Range: 0.0 ~ 1000.0
	spinDamage = 4.0
	#Item cooldown after a throw, in ticks.
	#Range: 0 ~ 1200
	cooldownTicks = 10
	#Launch velocity of a spinning ball (blocks per tick).
	#Range: 0.1 ~ 10.0
	spinVelocity = 1.6
	#Base damage of a ball thrown without Spin.
	#Range: 0.0 ~ 1000.0
	plainDamage = 2.0
	#Damage multiplier of a damaged (imperfect) ball.
	#Range: 0.0 ~ 1.0
	damagedDamageMultiplier = 0.7
	#If the ball has not reached the thrower within this many ticks of returning, it loses its rotation and drops.
	#Range: 1 ~ 6000
	maxReturnTicks = 200

